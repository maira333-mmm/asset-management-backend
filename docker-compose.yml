version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: asset_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: asset_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    container_name: asset_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - PORT=5000
      - DB_USER=postgres
      - DB_PASSWORD=admin123
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=asset_management_db
      - JWT_SECRET=super_secret_key_123
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data: